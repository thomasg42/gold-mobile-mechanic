<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101214">
  <meta name="robots" content="noindex">
  <meta name="description" content="Gold Mobile Mechanic customers and the work we've completed for them.">
  <title>Customers · Gold Mobile Mechanic</title>
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="portal-body">
  <header class="topbar">
    <a class="brand" href="./portal.html" aria-label="Gold Mobile Mechanic">
      <span class="brand-mark" aria-hidden="true"><span>G</span></span>
      <span>
        <strong>Gold Mobile</strong>
        <small>Customers</small>
      </span>
    </a>
  </header>

  <main class="page">
    <section id="portalDirectory">
      <div class="board-heading">
        <div>
          <p class="eyebrow">Open door</p>
          <h1>Every customer,<br><em>every job.</em></h1>
          <p>Find your name, tap it, and see the work we've done and what it came to.</p>
        </div>
      </div>

      <label class="field field-wide portal-search">
        <span>Search by name</span>
        <input id="portalSearch" type="search" autocomplete="off" placeholder="Start typing a name">
      </label>

      <p class="portal-error hidden" id="portalError" role="alert"></p>
      <div id="portalList"><p class="history-empty">Loading customers…</p></div>
    </section>

    <section id="portalProfile" class="hidden">
      <div class="board-heading">
        <div>
          <p class="eyebrow">Customer</p>
          <h1 id="portalName">Customer</h1>
          <p id="portalSummary"></p>
        </div>
        <div class="board-cta">
          <button class="button button-quiet" id="portalBack" type="button">← All customers</button>
        </div>
      </div>
      <div id="portalInvoices"></div>
    </section>
  </main>

  <script src="./portal.js"></script>
</body>
</html>
